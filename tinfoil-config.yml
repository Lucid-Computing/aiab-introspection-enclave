cvm-version: 0.14.9
cpus: 2
memory: 8192

# Router discovery and verification services need dynamic public destinations.
# Tinfoil blocks private/internal ranges even with open egress. See README.md.
networks:
  public:
    egress: open

containers:
  - name: aiab
    image: ghcr.io/lucid-computing/aiab-introspection-enclave@sha256:e42c2af9be20bd0aac1550f216b104b88f7f73121797558818c177b786e7f0db
    user: "65532:65532"
    read_only: true
    tmpfs:
      /tmp: "size=256m,mode=1777,nosuid,nodev,noexec"
    networks: [public]
    pids_limit: 256
    memory: "2g"
    cpus: 2.0
    env:
      - AIAB_MODE: "tinfoil"
      - AIAB_ID: "aiab-introspection"
      - ENFORCEMENT_MODE: "block"
      - BLOCK_THRESHOLD: "0.8"
      - INFERENCE_PROVIDER: "anthropic"
      - INFERENCE_URL: "https://api.anthropic.com"
      - ANTHROPIC_MODEL: "claude-sonnet-4-6"
      - AIAB_REQUIRE_GATEWAY_TOKEN: "true"
      - LISTEN_PORT: "8080"
      - SAMPLE_RATE: "0.05"
      - REPORT_PERIOD_SECONDS: "10"
      - REPORT_HISTORY: "100"
      - CLASSIFIER_MODEL: "gpt-oss-safeguard-120b"
      - CLASSIFIER_DEFINITION: "classifiers/ai_capabilities.md"
      - LOG_LEVEL: "INFO"
      - XDG_CACHE_HOME: "/tmp/aiab-cache"
      - XDG_DATA_HOME: "/tmp/aiab-data"
    secrets:
      - TINFOIL_API_KEY
      - ANTHROPIC_API_KEY
      - AIAB_GATEWAY_TOKEN
    healthcheck:
      test: ["CMD", "python", "-m", "aiab.healthcheck"]
      interval: "10s"
      timeout: "5s"
      retries: 3
      start_period: "30s"
    restart: "on-failure"

shim:
  upstream-container: aiab
  upstream-port: 8080
  paths:
    - /v1/chat/completions
    - /v1/models
    - /aiab/health
    - /aiab/manifest
    - /aiab/pubkey
    - /aiab/reports
    - /aiab/reports/latest
